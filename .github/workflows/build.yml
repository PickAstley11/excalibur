name: Build Excalibur Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Excalibur
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive

      - name: List project schemes
        run: |
          xcodebuild \
            -list \
            -project "darksword-kexploit-fun.xcodeproj"

      - name: Clean
        run: |
          xcodebuild clean \
            -project "darksword-kexploit-fun.xcodeproj" \
            -scheme "darksword-kexploit-fun" \
            -configuration Release

      - name: Archive unsigned app
        run: |
          set -o pipefail

          xcodebuild archive \
            -project "darksword-kexploit-fun.xcodeproj" \
            -scheme "darksword-kexploit-fun" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Excalibur.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Show build errors
        if: failure()
        run: |
          echo "========== XCODE ERRORS =========="

          grep -n -E \
            '(^|[[:space:]])error:|Command .* failed|ARCHIVE FAILED|BUILD FAILED|PhaseScriptExecution' \
            "$RUNNER_TEMP/xcodebuild.log" \
            || true

          echo
          echo "========== LAST 300 LINES =========="

          tail -n 300 "$RUNNER_TEMP/xcodebuild.log"

      - name: Locate application
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/Excalibur.xcarchive"

          echo "Archive contents:"
          find "$ARCHIVE" -maxdepth 5 -print

          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -name "kfun.app" \
            -type d \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "::error::kfun.app was not found!"
            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/kfun.app"

      - name: Remove signatures and provisioning
        run: |
          set +e

          APP="$RUNNER_TEMP/Payload/kfun.app"

          echo "Checking existing signature:"
          codesign -dvvv "$APP" 2>&1 || true

          echo "Removing code signatures..."
          find "$APP" \
            -type d \
            -name "_CodeSignature" \
            -prune \
            -exec rm -rf {} + 2>/dev/null || true

          echo "Removing provisioning profiles..."
          find "$APP" \
            -type f \
            -name "embedded.mobileprovision" \
            -delete 2>/dev/null || true

      - name: Create IPA
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -f Excalibur-unsigned.ipa

          zip -qry \
            Excalibur-unsigned.ipa \
            Payload

          echo "IPA created:"
          ls -lh Excalibur-unsigned.ipa

      - name: Verify IPA
        run: |
          set -e

          echo "========== IPA CONTENTS =========="

          unzip -l "$RUNNER_TEMP/Excalibur-unsigned.ipa"

          echo
          echo "========== EXTRACTING IPA =========="

          rm -rf "$RUNNER_TEMP/ipa-check"

          unzip -q \
            "$RUNNER_TEMP/Excalibur-unsigned.ipa" \
            -d "$RUNNER_TEMP/ipa-check"

          echo
          echo "========== PAYLOAD =========="

          ls -la "$RUNNER_TEMP/ipa-check/Payload"

          echo
          echo "========== APP =========="

          find "$RUNNER_TEMP/ipa-check/Payload/kfun.app" \
            -maxdepth 2 \
            -print

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Excalibur-unsigned-IPA
          path: ${{ runner.temp }}/Excalibur-unsigned.ipa
          if-no-files-found: error
          retention-days: 7