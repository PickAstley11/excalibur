name: Build bad_query Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode 27
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Show project information
        run: |
          xcodebuild \
            -list \
            -project "$PWD/bad_query.xcodeproj"

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project "$PWD/bad_query.xcodeproj" \
            -scheme "bad_query" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/bad_query.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p build/Payload

          cp -R \
            build/bad_query.xcarchive/Products/Applications/*.app \
            build/Payload/

          cd build
          zip -r bad_query-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query-unsigned-IPA
          path: build/bad_query-unsigned.ipa