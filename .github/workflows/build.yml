name: Build Excalibur Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: List project schemes
        run: |
          xcodebuild \
            -list \
            -project "darksword-kexploit-fun.xcodeproj"

      - name: Clean
        run: |
          xcodebuild clean \
            -project "darksword-kexploit-fun.xcodeproj" \
            -scheme "darksword-kexploit-fun" \
            -configuration Release

      - name: Archive unsigned app
        run: |
          xcodebuild archive \
            -project "darksword-kexploit-fun.xcodeproj" \
            -scheme "darksword-kexploit-fun" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Excalibur.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Find application
        run: |
          set -e

          ARCHIVE="$RUNNER_TEMP/Excalibur.xcarchive"
          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was found!"
            find "$ARCHIVE" -maxdepth 5 -print
            exit 1
          fi

          echo "Found:"
          echo "$APP"

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

      - name: Create IPA
        run: |
          set -e

          cd "$RUNNER_TEMP"
          rm -f Excalibur-unsigned.ipa

          zip -qry Excalibur-unsigned.ipa Payload

          echo "IPA created:"
          ls -lh Excalibur-unsigned.ipa

      - name: Verify IPA
        run: |
          unzip -l "$RUNNER_TEMP/Excalibur-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Excalibur-unsigned-IPA
          path: ${{ runner.temp }}/Excalibur-unsigned.ipa
          if-no-files-found: error
          retention-days: 7